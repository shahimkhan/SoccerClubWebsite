<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Platform Demo</title>
<meta name="description" content="Clickable demo of the proposed Berwick City SC website, member portal and admin console. Test data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#e11212; --brand-dark:#87090a; --brand-soft:#fdeaea;
  --ink:#151515; --ink-2:#4a4f55; --ink-3:#7a8088;
  --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f0f1f3; --line:#e2e4e8;
  --ok:#1f8a4c; --ok-soft:#e5f5ec; --warn:#b26a00; --warn-soft:#fff3df; --info:#1d5fbf; --info-soft:#e7effb;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --radius:12px;
  --font-head:"Archivo",system-ui,sans-serif; --font-body:"Nunito Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#ff3b3b; --brand-dark:#b31212; --brand-soft:#3a1616;
    --ink:#f2f2f3; --ink-2:#c3c7cd; --ink-3:#8d939b;
    --bg:#0f1012; --surface:#17191c; --surface-2:#202328; --line:#2c3036;
    --ok:#4cc782; --ok-soft:#163223; --warn:#f0a83a; --warn-soft:#3a2a10; --info:#6ea6ff; --info-soft:#14233d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --brand:#ff3b3b; --brand-dark:#b31212; --brand-soft:#3a1616;
  --ink:#f2f2f3; --ink-2:#c3c7cd; --ink-3:#8d939b;
  --bg:#0f1012; --surface:#17191c; --surface-2:#202328; --line:#2c3036;
  --ok:#4cc782; --ok-soft:#163223; --warn:#f0a83a; --warn-soft:#3a2a10; --info:#6ea6ff; --info-soft:#14233d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 1em}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-3)}
.small{font-size:.875rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:860px){.g-main{grid-template-columns:minmax(0,1fr)}}
.app > div{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--surface-2);color:var(--ink);transition:background .15s}
.btn:hover{filter:brightness(.97)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-sm{padding:6px 12px;font-size:.85rem}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.red{background:var(--brand-soft);color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--font-head);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.table-wrap table th:first-child,.table-wrap table td:first-child{padding-left:16px}
label{display:block;font-weight:700;font-size:.9rem;margin:0 0 4px}
input[type=text],input[type=email],input[type=date],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.field{margin-bottom:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{margin-top:4px}

/* demo bar */
.demobar{background:#000;color:#fff;font-size:.85rem}
.demobar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.demobar .tag{background:#ffd23f;color:#000;font-weight:800;border-radius:4px;padding:1px 8px;font-size:.75rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid #444;color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:.82rem}
.tab[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.themebtn{margin-left:auto}

/* public site */
.site-head{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
.site-head .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.crest{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:.85rem;flex:none;border:3px solid #151515}
.brandname{font-family:var(--font-head);font-weight:800;font-size:1.05rem;line-height:1.1;color:#fff;text-decoration:none}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav a{color:#fff;text-decoration:none;font-weight:700;padding:8px 12px;border-radius:8px;font-size:.92rem}
.nav a:hover,.nav a[aria-current=page]{background:rgba(0,0,0,.18)}
.menu-toggle{display:none;margin-left:auto;background:rgba(0,0,0,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
@media (max-width:860px){
  .menu-toggle{display:inline-block}
  .nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--brand-dark);flex-direction:column;padding:8px 16px 16px}
  .nav.open{display:flex}
}
.status-strip{background:#151515;color:#fff;font-size:.85rem}
.status-strip .wrap{display:flex;gap:16px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#4cc782}
.dot.closed{background:#ff5a5a}
.hero{background:linear-gradient(135deg,#151515 0%,#2b3136 55%,var(--brand-dark) 100%);color:#fff;padding:56px 0}
.hero p{color:#e8e8e8;max-width:620px;font-size:1.08rem}
.hero .stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:24px}
.hero .stat b{display:block;font-family:var(--font-head);font-size:1.8rem}
.section{padding:40px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.news-img{height:140px;border-radius:8px;margin:-4px -4px 14px;background:linear-gradient(135deg,var(--brand) 0%,#151515 100%);display:grid;place-items:center;color:#fff;font-family:var(--font-head);font-weight:800;font-size:1.4rem;opacity:.92}
.event-card{display:flex;flex-direction:column;gap:8px}
.event-card .meta{display:flex;gap:8px;flex-wrap:wrap}
.fixture{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fixture:last-child{border-bottom:0}
.fx-date{font-family:var(--font-head);font-weight:700;font-size:.85rem;color:var(--ink-3)}
.sponsor-tier{margin-bottom:20px}
.sponsor-logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.logo-box{border:1px dashed var(--line);border-radius:10px;height:70px;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;color:var(--ink-3);background:var(--surface);text-align:center;padding:6px;font-size:.88rem}
.site-foot{background:#151515;color:#cfd2d6;padding:32px 0;margin-top:24px;font-size:.9rem}
.site-foot a{color:#fff}

/* wizard */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.step{flex:1;min-width:110px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:.82rem;font-weight:700;color:var(--ink-3)}
.step.done{background:var(--ok-soft);color:var(--ok)}
.step.active{background:var(--brand);color:#fff}
.sum-line{display:flex;justify-content:space-between;padding:6px 0}
.sum-total{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:800;font-size:1.1rem}
.paybox{border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:block;font-weight:400}
.paybox:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}

/* app shell (portal + admin) */
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 44px)}
.side{background:#151515;color:#d7d9dc;padding:16px 12px;position:sticky;top:0;height:calc(100vh - 44px);overflow:auto}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid #2b2f34;margin-bottom:10px}
.side .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.side a{display:flex;justify-content:space-between;align-items:center;color:#d7d9dc;text-decoration:none;padding:9px 10px;border-radius:8px;font-weight:600;font-size:.93rem}
.side a:hover{background:#22262b}
.side a[aria-current=page]{background:var(--brand);color:#fff}
.side .grp{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#8a9097;margin:14px 10px 4px}
.side .count{background:#2b2f34;border-radius:999px;padding:0 8px;font-size:.75rem}
.main{padding:24px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:0}
.kpi .n{font-family:var(--font-head);font-size:1.9rem;font-weight:800;line-height:1.1}
.kpi .l{color:var(--ink-3);font-size:.85rem;font-weight:700}
.kpi .d{font-size:.82rem;margin-top:4px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--brand)}
.list-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.lane{background:var(--surface-2);border-radius:var(--radius);padding:10px}
.lane h4{display:flex;justify-content:space-between;font-size:.9rem;margin:2px 4px 10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:.88rem}
.kcard .acts{display:flex;gap:6px;margin-top:8px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.tick{color:var(--ok);font-weight:800}
.cross{color:var(--ink-3)}
.editor-sec{border:2px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.editor-sec:hover{border-color:var(--brand)}
.editor-sec .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:#151515;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);transition:transform .25s;z-index:100;max-width:calc(100% - 32px);font-size:.92rem}
.toast.show{transform:translateX(-50%) translateY(0)}
.chk{width:18px;height:18px}
.mobile-nav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-nav{display:block;padding:12px 16px 0}
  .main{padding:16px}
}
</style>
</head>
<body>

<div class="demobar">
  <div class="wrap">
    <span class="tag">DEMO</span>
    <span>Test data only. No real member data.</span>
    <div class="tabs" role="group" aria-label="Demo area">
      <button class="tab" data-area="site">Public website</button>
      <button class="tab" data-area="portal">Member portal</button>
      <button class="tab" data-area="admin">Admin console</button>
    </div>
    <button class="tab themebtn" id="themeBtn" aria-label="Toggle colour theme">Theme</button>
  </div>
</div>

<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Test data (fictional) ---------- */
const DATA = {
  events: [
    {id:"season-2027", name:"Season 2027 Registration", cat:"Season", closes:"28 Feb 2027", status:"Open", regos:498, players:593, cap:720, fee:"from $295", blurb:"Miniroos (U5 to U12) and Juniors (U13 to U18). Returning players register here. Sibling discounts apply."},
    {id:"ypl-eoi-2027", name:"EOI 2027: YPL Teams", cat:"EOI", closes:"22 Jan 2027", status:"Open", regos:649, players:681, cap:null, fee:"No fee", blurb:"Expressions of interest for U13 to U18 Youth Premier League squads. Trials by invitation only."},
    {id:"community-eoi-2027", name:"EOI 2027: Community Teams", cat:"EOI", closes:"30 Mar 2027", status:"Open", regos:479, players:550, cap:null, fee:"No fee", blurb:"New players only. Tryouts are invite only due to high retention."},
    {id:"summer-clinic", name:"Summer Holiday Clinic", cat:"Clinic", closes:"10 Jan 2027", status:"Open", regos:41, players:52, cap:80, fee:"$120", blurb:"Three-day skills clinic for ages 6 to 12, run by club technical staff."},
    {id:"seniors-reserves", name:"EOI 2027: Senior Men's Reserves", cat:"EOI", closes:"26 Nov 2026", status:"Closing soon", regos:38, players:38, cap:null, fee:"No fee", blurb:"Pathway for younger players into senior football."}
  ],
  news: [
    {t:"Season 2027 registrations now open", d:"12 Nov 2026", tag:"Club", x:"Returning families have received their invite link. New players should submit a Community EOI first."},
    {t:"Breaking Barriers: Episode 4 released", d:"8 Nov 2026", tag:"Seniors", x:"The documentary series continues with behind-the-scenes footage from the senior squad."},
    {t:"Coaches and team managers wanted", d:"3 Nov 2026", tag:"Volunteers", x:"Every team needs a coach and a manager. Coaches receive a fee discount and full club support."}
  ],
  fixtures: [
    {date:"Sat 21 Nov", time:"9:00am", grp:"U9 Miniroos", home:"Berwick City U9 Eagles", away:"Casey Comets U9 Bilbies", venue:"Jack Thomas Reserve, Pitch 1"},
    {date:"Sat 21 Nov", time:"10:15am", grp:"U12 Miniroos", home:"Dandenong Thunder U12", away:"Berwick City U12 Wallabies", venue:"George Andrews Reserve"},
    {date:"Sun 22 Nov", time:"9:00am", grp:"U14 Juniors", home:"Berwick City U14 A", away:"Elwood City U14", venue:"Sweeney Reserve, Pitch 3"},
    {date:"Sun 22 Nov", time:"11:00am", grp:"U16 YPL", home:"Berwick City U16 YPL", away:"Bentleigh Greens U16", venue:"Jack Thomas Reserve, Pitch 2"},
    {date:"Sun 22 Nov", time:"3:00pm", grp:"Senior Women", home:"Berwick City Women", away:"Doveton SC Women", venue:"Jack Thomas Reserve, Pitch 1"}
  ],
  sponsors: {"Major Sponsor":["Major Partner"],"Gold Sponsors":["Gold Partner A","Gold Partner B","Gold Partner C","Gold Partner D"],"Production Partner":["Media Partner"],"Berwick Business Buddies":["Local Cafe","Physio Clinic","Plumbing Co","Real Estate","Accountants","Bakery"]},
  regos: [
    {fam:"Nguyen family", players:"2 players", grp:"U10, U13", inv:590, paid:590, status:"Active", pay:"Paid"},
    {fam:"Taylor family", players:"1 player", grp:"U15", inv:345, paid:100, status:"Active", pay:"Payment plan"},
    {fam:"Okafor family", players:"3 players", grp:"U8, U11, U14", inv:860, paid:0, status:"Incomplete", pay:"Owing"},
    {fam:"Rossi family", players:"1 player", grp:"U16 YPL", inv:1450, paid:725, status:"Modified", pay:"Part paid"},
    {fam:"Singh family", players:"2 players", grp:"U7, U9", inv:520, paid:520, status:"Active", pay:"Paid"},
    {fam:"Murphy family", players:"1 player", grp:"U12", inv:295, paid:295, status:"Active", pay:"Paid"},
    {fam:"Haddad family", players:"1 player", grp:"U18", inv:345, paid:0, status:"Active", pay:"Owing"},
    {fam:"Chen family", players:"2 players", grp:"U11, U14", inv:640, paid:320, status:"Active", pay:"Payment plan"}
  ],
  pipeline: {
    "EOI received":["Player A (U14)","Player B (U15)","Player C (U13)","Player D (U16)"],
    "Invited to trial":["Player E (U14)","Player F (U18)","Player G (U13)"],
    "Trialled":["Player H (U15)","Player I (U16)"],
    "Offered":["Player J (U14)","Player K (U13)"],
    "Accepted":["Player L (U16)","Player M (U15)"],
    "Unsuccessful":["Player N (U18)"]
  },
  people: [
    {name:"Coach 01",role:"Head coach, U12 Wallabies",wwcc:"Valid",exp:"Mar 2029"},
    {name:"Coach 02",role:"Head coach, U14 A",wwcc:"Expiring",exp:"Dec 2026"},
    {name:"Manager 03",role:"Team manager, U9 Eagles",wwcc:"Valid",exp:"Aug 2030"},
    {name:"Coach 04",role:"Assistant coach, U16 YPL",wwcc:"Missing",exp:"-"},
    {name:"Manager 05",role:"Team manager, Senior Women",wwcc:"Valid",exp:"Jan 2028"}
  ],
  audit: [
    {t:"14 Nov 10:42",who:"Treasurer",a:"Approved payment plan",obj:"Plan #PP-0193"},
    {t:"14 Nov 10:15",who:"Registrar",a:"Exported registrations (CSV)",obj:"Season 2027"},
    {t:"14 Nov 09:58",who:"Secretary",a:"Changed role access",obj:"Content editor: added Events"},
    {t:"13 Nov 21:03",who:"Coach 02",a:"Viewed guardian contacts",obj:"U14 A"},
    {t:"13 Nov 19:40",who:"System",a:"Blocked team access (WWCC missing)",obj:"Coach 04"}
  ]
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const money = n => "$" + n.toLocaleString("en-AU");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}
function pill(s){const m={Active:"ok",Paid:"ok",Valid:"ok",Open:"ok",Accepted:"ok","Payment plan":"info",Modified:"warn",Incomplete:"warn","Part paid":"warn",Expiring:"warn","Closing soon":"warn",Owing:"red",Missing:"red",Unsuccessful:"red"};return `<span class="pill ${m[s]||""}">${esc(s)}</span>`}
function go(hash){location.hash=hash}

/* ---------- Registration wizard state ---------- */
const wiz = {step:0, players:[{first:"Sam",dob:"2016-05-12",grp:"U10 Miniroos"},{first:"Alex",dob:"2013-09-03",grp:"U13 Juniors"}], pay:"card", agreed:false};
const FEES = {"U6 Miniroos":180,"U8 Miniroos":250,"U10 Miniroos":295,"U12 Miniroos":295,"U13 Juniors":345,"U15 Juniors":345,"U18 Juniors":345};
function feeLines(){
  const lines = wiz.players.map((p,i)=>({label:`${p.first||"Player "+(i+1)}: ${p.grp} registration`, amt:FEES[p.grp]||295}));
  const kit = wiz.players.length*45;
  lines.push({label:`Playing kit (${wiz.players.length} x $45)`, amt:kit});
  if(wiz.players.length>1){
    const sorted=[...wiz.players].map(p=>FEES[p.grp]||295).sort((a,b)=>a-b);
    const disc=sorted.slice(0,wiz.players.length-1).reduce((a,b)=>a+Math.round(b*0.1),0);
    lines.push({label:"Sibling discount (10% on second and later players)", amt:-disc});
  }
  return lines;
}

/* ---------- Public site ---------- */
function siteShell(page, body){
  const nav=[["home","Home"],["whats-on","What's On"],["fixtures","Fixtures"],["teams","Programs"],["sponsors","Sponsors"],["contact","Contact"]];
  return `
  <header class="site-head">
    <div class="wrap">
      <span class="crest" aria-hidden="true">BCSC</span>
      <a class="brandname" href="#site/home">Berwick City<br>Soccer Club</a>
      <button class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('open')" aria-label="Open menu">Menu</button>
      <nav class="nav" aria-label="Main">
        ${nav.map(([k,l])=>`<a href="#site/${k}" ${page===k?'aria-current="page"':""}>${l}</a>`).join("")}
        <a href="#portal/home">Sign in</a>
      </nav>
    </div>
  </header>
  <div class="status-strip"><div class="wrap">
    <span><span class="dot"></span>Jack Thomas Reserve: open</span>
    <span><span class="dot"></span>Sweeney Reserve: open</span>
    <span class="muted" style="color:#9aa0a6">Updated 7:10am today</span>
  </div></div>
  <main>${body}</main>

function moveCard(lane,idx,dir){const lanes=Object.keys(DATA.pipeline);const li=lanes.indexOf(lane);const [p]=DATA.pipeline[lane].splice(idx,1);DATA.pipeline[lanes[li+dir]].push(p);render();toast(`${p} moved to ${lanes[li+dir]}.`)}
function updSel(){const n=document.querySelectorAll('.rowchk:checked').length;$("#selcount").textContent=n+" selected"}

/* ---------- Router ---------- */
function render(){
  const [area="site", page="home", arg] = (location.hash.slice(1)||"site/home").split("/");
  document.querySelectorAll(".tab[data-area]").forEach(t=>t.setAttribute("aria-pressed", t.dataset.area===area));
  const route=area+"/"+page;
  if(page==="register" && render.last!==route){ wiz.step=0; wiz.agreed=false; }
  render.last=route;
  let html="";
  if(area==="site"){
    html = page==="whats-on"?siteWhatsOn(): page==="event"?siteEvent(arg): page==="register"?siteRegister(arg): page==="fixtures"?siteFixtures(): page==="teams"?siteTeams(): page==="sponsors"?siteSponsors(): page==="contact"?siteContact(): page==="shop"?siteShop(): siteHome();
  } else if(area==="portal"){ html = portal(PORTAL_NAV.some(n=>n.k===page)?page:"home"); }
  else { html = admin(ADMIN_NAV.some(n=>n.k===page)?page:"dashboard"); }
  $("#root").innerHTML = html;
}
document.querySelectorAll(".tab[data-area]").forEach(t=>t.addEventListener("click",()=>{const a=t.dataset.area;go(a+"/"+(a==="site"?"home":a==="portal"?"home":"dashboard"));window.scrollTo(0,0)}));
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
$("#themeBtn").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark"});
render();
</script>
